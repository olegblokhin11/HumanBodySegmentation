line-length = 100
target-version = "py39"

exclude = [
    ".git",
    ".ruff_cache",
    "checkpoints",
    "data",
    "tensorboard",
]

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]

[lint.per-file-ignores]
# Streamlit scripts legitimately build the UI at import time.
"app.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
