name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  smoke:
    name: Import and forward-pass smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check that every module imports
        run: |
          python -c "
          import app
          import evaluate
          import train
          print('imports OK')
          "

      - name: Build the model and check the output shapes of all three levels
        run: |
          python -c "
          import torch
          from models.hierarchical_deeplabv3 import HierarchicalDeepLabV3
          from utils.data_utils import level_to_num_classes

          levels = ['mask_level_0', 'mask_level_1', 'mask_level_2']
          model = HierarchicalDeepLabV3(
              num_classes_level_0=level_to_num_classes[0],
              num_classes_level_1=level_to_num_classes[1],
              num_classes_level_2=level_to_num_classes[2],
              backbone='resnet50',
              pretrained=False,
          )
          model.eval()

          with torch.no_grad():
              outputs = model(torch.randn(1, 3, 128, 128))

          assert set(outputs) == set(levels), outputs.keys()
          for level_idx, key in enumerate(levels):
              expected = (1, level_to_num_classes[level_idx], 128, 128)
              assert tuple(outputs[key].shape) == expected, (key, outputs[key].shape)
          print('forward pass OK')
          "

      - name: Check the metrics implementation
        run: |
          python -c "
          import numpy as np
          from utils.metrics import SegmentationMetrics

          # One column per class, so every class is present at every level.
          target = np.zeros((1, 7, 7), dtype=np.int64)
          for class_idx in range(7):
              target[:, :, class_idx] = class_idx

          # A perfect prediction scores an mIoU of 1.0 at all three levels.
          metrics = SegmentationMetrics()
          metrics.reset()
          for level_idx in range(3):
              metrics.add_batch(target, target, level_idx=level_idx)
          for level_idx in range(3):
              miou = metrics.mean_intersection_over_union(level_idx=level_idx)
              assert miou == 1.0, (level_idx, miou)

          # Predicting background everywhere scores 0.0 for the body class.
          metrics.reset()
          metrics.add_batch(target, np.zeros_like(target), level_idx=0)
          assert metrics.mean_intersection_over_union(level_idx=0) == 0.0
          print('metrics OK')
          "
